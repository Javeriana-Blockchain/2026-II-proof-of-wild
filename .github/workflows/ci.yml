name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contrato:
    name: Pruebas del contrato Raíz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/raiz

      - name: cargo test
        run: cargo test --locked --manifest-path contracts/raiz/Cargo.toml
