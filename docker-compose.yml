services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pow
      POSTGRES_PASSWORD: pow
      POSTGRES_DB: proofofwild
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pow -d proofofwild"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
